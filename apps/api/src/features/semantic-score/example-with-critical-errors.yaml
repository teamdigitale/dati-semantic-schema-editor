# > 🇮🇹 ITALIAN

# Questo editor ti permette di creare e modificare schemi dati OpenAPI
# attingendo alle risorse semantiche del catalogo nazionale per la semantica dei dati <https://schema.gov.it>.
# Cerca ontologie e vocabolari controllati per descrivere in modo non ambiguo
# i dati scambiati tra i tuoi sistemi, poi esporta lo schema pronto per <https://api.gov.it>.

# Usa la barra di ricerca per trovare risorse semantiche,
# componi il tuo schema e scarica il file OpenAPI generato.

# > 🇬🇧 ENGLISH

# This editor lets you create and edit OpenAPI data schemas
# by drawing on the semantic resources of the national semantic data catalog <https://schema.gov.it>.
# Search ontologies and controlled vocabularies to unambiguously define
# the data exchanged between your systems, then export the schema ready for <https://api.gov.it>.

# Use the search bar to find semantic resources,
# compose your schema and download the generated OpenAPI file.

openapi: 3.0.3
components:
  schemas:
    EducationLevel:
      x-jsonld-type: https://w3id.org/italia/onto/CPV/EducationLevel
      x-jsonld-context: null
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
        id:
          type: string
          maxLength: 3
          description: |-
            Il livello di istruzione della persona.
            I valori ammessi sono indicati nel [vocabolario](https://w3id.org/italia/controlled-vocabulary/classifications-for-people/education-level)
          enum:
            - ACO
            - CDU
            - FLA
            - IFP
            - IFTS
            - ITS
            - L
            - LD
            - LS
            - LSE
            - NED
            - PSE
            - RDD
            - SLA
            - USG
            - USV
      example:
        id: NED
        description: Nessun titolo di studio
    EUCountry:
      description: >-
        Just a flexible schema tied to the EU country vocabulary.
      x-jsonld-type: Country
      x-jsonld-context: null
      type: object
    Parent:
      x-jsonld-context: null
      type: object
      x-jsonld-type: https://w3id.org/italia/onto/CPV/Person
      description: |-
        Uno schema semplificato per associare una sola chiave
        che identifica un genitore.
      additionalProperties: false
      required:
        - parent_id
      properties:
        parent_id:
          $ref: "#/components/schemas/TaxCode"
    BirthPlace:
      type: object
      additionalProperties: false
      required:
        - city
        - province
        - country
      x-jsonld-context: null
      properties:
        city:
          type: string
          description: The city where the person was born.
          example: Roma
        province:
          type: string
          description: The province where the person was born.
          example: RM
        country:
          type: string
          description: The iso alpha-3 code of the country where the person was born.
          example: ITA
        postCode:
          type: string
          description: The post code (zip code)
          example: "00100"
        interno:
          type: string
          maxLength: 32
      example:
        city: Roma
        province: RM
        country: ITA
        postCode: "00100"
        interno: "Interno 8"
    Person:
      type: object
      x-jsonld-type: https://w3id.org/italia/onto/CPV/Person
      # This custom property defines the associated json-ld
      #   context that can be used to semantically describe
      #   the instances.
      x-jsonld-context: "This is an invalid context!!!"
      additionalProperties: false
      description: |-
        Questo schema rappresenta una persona fisica.
      required:
        - given_name
        - family_name
        - tax_code
      properties:
        tax_code:
          $ref: "#/components/schemas/TaxCode"
        family_name:
          maxLength: 255
          type: string
        given_name:
          maxLength: 255
          type: string
        date_of_birth:
          format: date
          type: string
        education_level:
          type: string
          maxLength: 3
          description: |-
            Il livello di istruzione della persona.
            I valori ammessi sono indicati nel [vocabolario](https://w3id.org/italia/controlled-vocabulary/classifications-for-people/education-level)
        birth_place:
          $ref: "#/components/schemas/BirthPlace"
        resident_in:
          type: string
          description: >-
            Comune di residenza.
          maxLength: 32
        children:
          type: array
          items:
            $ref: "#/components/schemas/Person"
          minItems: 0
          maxItems: 50
        parents:
          type: array
          items:
            $ref: "#/components/schemas/Parent"
          maxItems: 2
          minItems: 0
      example:
        tax_code: RSSMRA75L01H501A
        family_name: Rossi
        given_name: Mario
        date_of_birth: "1961-01-01"
        education_level: "NED"
        birth_place:
          city: Roma
          province: RM
          country: ITA
        children:
          - tax_code: RSSMRA75L01H501A
          - tax_code: RSSMRA76L01H501A
          - tax_code: RSSMRA77L01H501A
    TaxCode:
      type: string
      description: >-
        An (eventually provisional) tax code.

        Note: assigning a x-jsonld-type to a primitive type would not add any
        semantic information.
      example: RSSMRA75L01H501A
      maxLength: 16
      minLength: 11
      pattern: >-
        [A-Z0-9]{16}
    ExportedSchemas:
      anyOf:
        - $ref: "#/components/schemas/Person"
        - $ref: "#/components/schemas/EducationLevel"
paths: {}
servers: []
tags: []
