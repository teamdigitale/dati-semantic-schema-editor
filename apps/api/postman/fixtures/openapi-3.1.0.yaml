openapi: 3.1.0
info:
  title: A 3.1.0 schema collection
  version: '1.0.0'
  description: |-
    Documento OpenAPI 3.1.0. L'API supporta solo la 3.0.x, quindi
    ci si attende un errore 406 Not Acceptable con un detail che
    cita la versione 3.0.x richiesta.
paths: {}
servers: []
tags: []
components:
  schemas:
    Person:
      type: object
      additionalProperties: false
      required:
        - given_name
        - family_name
      properties:
        family_name:
          type: string
          maxLength: 255
        given_name:
          type: string
          maxLength: 255
      example:
        family_name: Rossi
        given_name: Mario
